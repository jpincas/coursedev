id: iteration-demo
title: "The Iteration Pattern in Action"
model_label: "Claude"

system: |
  You are a business proposal writer. You help teams create professional,
  persuasive proposals for prospective clients. You write in a clear,
  professional style and pay close attention to client needs and feedback.

scratchpad:
  "reference/client-brief.md": |
    # Acme Healthcare — Client Brief

    **Organization:** Acme Healthcare
    Regional hospital network with 3 facilities and approximately 800 staff members

    **Project Objective:** Modernize patient data systems

    **Budget Range:** $150,000 - $200,000

    **Timeline:** Q2 2026 implementation (April-June)

    **Key Pain Point:**
    Data is siloed across departments. Clinical, billing, and administrative
    systems don't communicate. This causes delays in patient care, billing
    errors, and duplicate data entry work.

    **Decision Makers:**
    - CTO: Needs technical implementation details, integration approach, security
    - CFO: Focused on ROI, cost structure, ongoing support costs

  "reference/pricing-tiers.md": |
    # Pricing Structure — Healthcare Integration Services

    ## Tier 1: Essential
    **Price:** $120,000
    - Core system integration (2 departments of client's choice)
    - Data migration and validation
    - 6 months post-implementation support
    - Standard security protocols

    ## Tier 2: Professional
    **Price:** $180,000
    - Full integration across all departments
    - Complete data migration and validation
    - 12 months post-implementation support
    - Staff training program included (3 sessions)
    - Advanced security and compliance protocols
    - Quarterly system health checks

    ## Tier 3: Enterprise
    **Price:** Custom (typically $220,000+)
    - Everything in Professional tier
    - Dedicated customer success manager
    - Quarterly optimization reviews
    - Priority support with 4-hour response time
    - Custom reporting dashboards
    - Annual strategic planning session

  "reference/previous-proposal.md": |
    # Previous Proposal Example — TechCorp Integration

    ## Why We're the Right Partner

    You're dealing with disconnected systems that slow your team down.
    We've solved this exact problem for 12 organizations over the past 3 years.

    **Our track record:**
    • 3-year focus on healthcare data integration
    • 12 successful implementations (hospitals, clinics, regional networks)
    • Average 40% reduction in duplicate data entry
    • Zero security incidents across all clients

    ## What We'll Do

    We don't just connect systems — we redesign your data workflow.

    **Phase 1: Discovery** (Weeks 1-2)
    Map existing systems, identify integration points, define success metrics

    **Phase 2: Architecture** (Weeks 3-4)
    Design integration architecture, security protocols, data validation rules

    **Phase 3: Implementation** (Weeks 5-10)
    Build integrations, migrate data, test thoroughly

    **Phase 4: Training & Launch** (Weeks 11-12)
    Train your team, go live with support, monitor closely

    ## Timeline

    Start: April 1, 2026
    Go-live: June 15, 2026
    Full deployment: June 30, 2026

    12-week implementation from kickoff to full deployment.

tools:
  - scratchpad_read
  - scratchpad_write

visibility:
  system_prompt: toggleable
  tool_calls: visible
  full_context: hidden

sidebar:
  width: "45%"
  start_open: true

script:
  - type: note
    text: "Watch how specific feedback transforms output quality. The first draft will be decent but generic — typical AI output without guidance."

  - type: user
    content: "Write a proposal for Acme Healthcare based on the client brief"

  - type: tool_call
    tool: scratchpad_read
    args:
      filename: "reference/client-brief.md"

  - type: tool_result
    tool: scratchpad_read
    content: |
      # Acme Healthcare — Client Brief

      **Organization:** Acme Healthcare
      Regional hospital network with 3 facilities and approximately 800 staff members

      **Project Objective:** Modernize patient data systems

      **Budget Range:** $150,000 - $200,000

      **Timeline:** Q2 2026 implementation (April-June)

      **Key Pain Point:**
      Data is siloed across departments. Clinical, billing, and administrative
      systems don't communicate. This causes delays in patient care, billing
      errors, and duplicate data entry work.

      **Decision Makers:**
      - CTO: Needs technical implementation details, integration approach, security
      - CFO: Focused on ROI, cost structure, ongoing support costs

  - type: assistant
    content: "I'll create a professional proposal for Acme Healthcare addressing their patient data modernization needs."

  - type: tool_call
    tool: scratchpad_write
    args:
      filename: "proposal-draft.md"
      content: |
        # Healthcare Data Integration Proposal
        ## For Acme Healthcare

        ### Executive Summary

        In today's healthcare landscape, integrated data systems are essential
        for delivering quality patient care. Acme Healthcare's current challenge
        with siloed data across departments creates operational inefficiencies
        that impact both patient outcomes and financial performance.

        We propose a comprehensive data integration solution that will unify
        your clinical, billing, and administrative systems into a cohesive
        platform. This will eliminate duplicate data entry, reduce billing
        errors, and improve care coordination across your three facilities.

        ### Our Approach

        Our proven methodology includes:
        - Comprehensive system assessment and integration planning
        - Secure data migration with validation protocols
        - Staff training and change management support
        - Ongoing technical support post-implementation

        ### Technical Implementation

        We will implement industry-standard integration protocols to connect
        your existing systems. Our approach ensures data security, compliance
        with healthcare regulations, and minimal disruption to operations.

        Key technical components:
        - API-based integration architecture
        - Real-time data synchronization
        - Role-based access controls
        - Comprehensive audit logging

        ### Investment

        Based on your requirements and budget, we recommend our Professional
        tier solution at $180,000. This includes full integration across all
        departments, complete data migration, staff training, and 12 months
        of post-implementation support.

        ### Timeline

        We can begin implementation in Q2 2026 as requested, with a typical
        project timeline of 12-14 weeks from kickoff to full deployment.

        ### Next Steps

        We would welcome the opportunity to discuss this proposal in detail
        and answer any questions from your technical and financial leadership.

