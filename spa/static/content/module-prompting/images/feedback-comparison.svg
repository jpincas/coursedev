<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" style="max-width: 900px; background-color: transparent;">
  <style>
    text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .title-bad { fill: #ef4444; font-size: 20px; font-weight: 600; }
    .title-good { fill: #00d9c0; font-size: 20px; font-weight: 600; }
    .content-bad { fill: #a1a1aa; font-size: 24px; font-style: italic; }
    .content-good { fill: #fafafa; font-size: 18px; }
    .box-bad { fill: #27272a; stroke: #ef4444; stroke-width: 3; }
    .box-good { fill: #27272a; stroke: #00d9c0; stroke-width: 3; }
  </style>

  <!-- Vague feedback box -->
  <rect x="40" y="80" width="320" height="180" rx="8" ry="8" class="box-bad" />
  <text x="70" y="115" class="title-bad">❌ Vague</text>
  <text x="200" y="175" text-anchor="middle" class="content-bad">"Make this better."</text>

  <!-- Specific feedback box -->
  <rect x="440" y="80" width="420" height="180" rx="8" ry="8" class="box-good" />
  <text x="470" y="115" class="title-good">✅ Specific</text>
  <text x="470" y="145" class="content-good">"The second paragraph</text>
  <text x="470" y="170" class="content-good">lacks a concrete example.</text>
  <text x="470" y="195" class="content-good">Add a case study from the</text>
  <text x="470" y="220" class="content-good">healthcare sector."</text>
</svg>
