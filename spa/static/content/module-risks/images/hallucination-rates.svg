<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="max-width: 800px; background-color: transparent;">
  <style>
    text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .title { fill: #fafafa; font-size: 24px; font-weight: 600; }
    .subtitle { fill: #a1a1aa; font-size: 18px; }
    .label { fill: #fafafa; font-size: 16px; font-weight: 500; }
  </style>

  <!-- Title and subtitle -->
  <text x="400" y="50" text-anchor="middle" class="title">Hallucination Rates Vary Dramatically by Domain</text>
  <text x="400" y="85" text-anchor="middle" class="subtitle">Higher stakes = higher risk</text>

  <!-- Bars -->
  <rect x="120" y="370" width="100" height="30" rx="4" ry="4" fill="#84cc16" />
  <rect x="280" y="240" width="100" height="160" rx="4" ry="4" fill="#fb923c" />
  <rect x="440" y="180" width="100" height="220" rx="4" ry="4" fill="#f97316" />
  <rect x="600" y="120" width="100" height="280" rx="4" ry="4" fill="#dc2626" />

  <!-- Labels -->
  <text x="170" y="425" text-anchor="middle" class="label">Gemini</text>
  <text x="170" y="448" text-anchor="middle" class="label">0.7%</text>

  <text x="330" y="425" text-anchor="middle" class="label">o3</text>
  <text x="330" y="448" text-anchor="middle" class="label">33%</text>

  <text x="490" y="425" text-anchor="middle" class="label">o4-mini</text>
  <text x="490" y="448" text-anchor="middle" class="label">48%</text>

  <text x="650" y="425" text-anchor="middle" class="label">Legal</text>
  <text x="650" y="448" text-anchor="middle" class="label">queries</text>
  <text x="650" y="471" text-anchor="middle" class="label">58-82%</text>
</svg>