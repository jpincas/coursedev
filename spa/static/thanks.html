<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Message Sent — Learn AI with Jon</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
			background: #020617;
			color: #fff;
			-webkit-font-smoothing: antialiased;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}
		a { color: inherit; text-decoration: none; }
		nav {
			border-bottom: 1px solid rgba(255,255,255,0.05);
			padding: 1rem 1.5rem;
		}
		nav .inner {
			max-width: 72rem;
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		nav .brand {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			font-size: 0.875rem;
			font-weight: 700;
		}
		nav .brand img {
			width: 2rem;
			height: 2rem;
			border-radius: 9999px;
			object-fit: cover;
			box-shadow: 0 0 0 2px rgba(20,184,166,0.3);
		}
		nav .cta {
			background: #14b8a6;
			color: #fff;
			padding: 0.5rem 1.25rem;
			border-radius: 9999px;
			font-size: 0.875rem;
			font-weight: 600;
			transition: background 0.15s;
		}
		nav .cta:hover { background: #0d9488; }
		.page {
			flex: 1;
			max-width: 40rem;
			margin: 0 auto;
			padding: 8rem 1.5rem 4rem;
			width: 100%;
			text-align: center;
		}
		.icon {
			width: 5rem;
			height: 5rem;
			border-radius: 1rem;
			background: rgba(20,184,166,0.1);
			border: 1px solid rgba(20,184,166,0.2);
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 2rem;
		}
		.icon svg { color: #14b8a6; }
		h1 {
			font-size: 2.25rem;
			font-weight: 700;
			letter-spacing: -0.02em;
			margin-bottom: 1rem;
		}
		.msg {
			color: #94a3b8;
			font-size: 1.125rem;
			line-height: 1.7;
			margin-bottom: 0.75rem;
		}
		.sub { color: #64748b; margin-bottom: 2.5rem; }
		.actions {
			display: flex;
			gap: 1rem;
			justify-content: center;
			flex-wrap: wrap;
		}
		.btn-primary {
			background: #14b8a6;
			color: #fff;
			padding: 0.875rem 2rem;
			border-radius: 9999px;
			font-size: 0.875rem;
			font-weight: 600;
			transition: all 0.15s;
		}
		.btn-primary:hover {
			background: #0d9488;
			box-shadow: 0 8px 25px rgba(20,184,166,0.25);
			transform: translateY(-1px);
		}
		.btn-ghost {
			border: 1px solid rgba(255,255,255,0.1);
			padding: 0.875rem 1.5rem;
			border-radius: 9999px;
			font-size: 0.875rem;
			font-weight: 500;
			color: #cbd5e1;
			transition: all 0.15s;
		}
		.btn-ghost:hover {
			background: rgba(255,255,255,0.05);
			border-color: rgba(255,255,255,0.2);
		}
		footer {
			border-top: 1px solid rgba(255,255,255,0.05);
			padding: 2.5rem 1.5rem;
		}
		footer .inner {
			max-width: 72rem;
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 0.875rem;
			color: #334155;
		}
		footer .brand { display: flex; align-items: center; gap: 0.75rem; }
		footer .brand img { width: 1.5rem; height: 1.5rem; border-radius: 9999px; object-fit: cover; }
	</style>
</head>
<body>
	<nav>
		<div class="inner">
			<a href="/" class="brand">
				<img src="/images/jon.png" alt="Jon" />
				<span>Learn AI with Jon</span>
			</a>
			<a href="/training" class="cta">Start Learning</a>
		</div>
	</nav>

	<div class="page">
		<div class="icon">
			<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
				<path d="M5 13l4 4L19 7"/>
			</svg>
		</div>
		<h1>Message sent!</h1>
		<p class="msg">Thanks for reaching out. I'll get back to you as soon as I can — usually within a day or two.</p>
		<p class="sub">In the meantime, why not dive into the training?</p>
		<div class="actions">
			<a href="/training" class="btn-primary">Start Training</a>
			<a href="/" class="btn-ghost">Back to homepage</a>
		</div>
	</div>

	<footer>
		<div class="inner">
			<div class="brand">
				<img src="/images/jon.png" alt="Jon" />
				<span>Learn AI with Jon</span>
			</div>
			<span>&copy; 2026</span>
		</div>
	</footer>
</body>
</html>
