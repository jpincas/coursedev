<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600"
     style="max-width: 820px; background-color: transparent;">
  <style>
    text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .title { font-size: 22px; font-weight: 600; }
    .label { font-size: 16px; }
    .dim { fill: #a1a1aa; }
    .very-dim { fill: #71717a; }
    .bright { fill: #fafafa; }
    .accent { fill: #00d9c0; }
    .panel-dim { fill: #27272a; stroke: #3f3f46; stroke-width: 2; }
    .panel-accent { fill: #27272a; stroke: #00d9c0; stroke-width: 2; }
    .step { fill: #3f3f46; stroke: #52525b; stroke-width: 2; }
    .box-accent { fill: #18181b; stroke: #00d9c0; stroke-width: 2; }
    .connector-dim { stroke: #52525b; stroke-width: 2; fill: none; }
    .connector-accent { stroke: #00d9c0; stroke-width: 3; fill: none; }
  </style>

  <defs>
    <marker id="arrowhead-dim" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#52525b" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d9c0" />
    </marker>
  </defs>

  <!-- Left Panel: Micromanaging -->
  <rect x="40" y="40" width="320" height="520" rx="8" class="panel-dim" />
  <text x="200" y="80" text-anchor="middle" class="title dim">Micromanaging</text>

  <!-- Step 1 -->
  <rect x="80" y="120" width="240" height="60" rx="6" class="step" />
  <text x="200" y="155" text-anchor="middle" class="label very-dim">Step 1</text>
  <line x1="200" y1="185" x2="200" y2="200" class="connector-dim" marker-end="url(#arrowhead-dim)" />

  <!-- Step 2 -->
  <rect x="80" y="205" width="240" height="60" rx="6" class="step" />
  <text x="200" y="240" text-anchor="middle" class="label very-dim">Step 2</text>
  <line x1="200" y1="270" x2="200" y2="285" class="connector-dim" marker-end="url(#arrowhead-dim)" />

  <!-- Step 3 -->
  <rect x="80" y="290" width="240" height="60" rx="6" class="step" />
  <text x="200" y="325" text-anchor="middle" class="label very-dim">Step 3</text>
  <line x1="200" y1="355" x2="200" y2="370" class="connector-dim" marker-end="url(#arrowhead-dim)" />

  <!-- Step 4 -->
  <rect x="80" y="375" width="240" height="60" rx="6" class="step" />
  <text x="200" y="410" text-anchor="middle" class="label very-dim">Step 4</text>
  <line x1="200" y1="440" x2="200" y2="455" class="connector-dim" marker-end="url(#arrowhead-dim)" />

  <!-- Step 5 -->
  <rect x="80" y="460" width="240" height="60" rx="6" class="step" />
  <text x="200" y="495" text-anchor="middle" class="label very-dim">Step 5</text>

  <!-- Central Arrow -->
  <line x1="380" y1="300" x2="440" y2="300" class="connector-accent" marker-end="url(#arrowhead-accent)" />

  <!-- Right Panel: Delegating -->
  <rect x="460" y="40" width="320" height="520" rx="8" class="panel-accent" />
  <text x="620" y="80" text-anchor="middle" class="title bright">Delegating</text>

  <!-- Outcome -->
  <rect x="500" y="160" width="240" height="80" rx="6" class="box-accent" />
  <text x="620" y="205" text-anchor="middle" class="label accent">Outcome</text>

  <!-- Arrow down -->
  <line x1="620" y1="250" x2="620" y2="350" class="connector-accent" marker-end="url(#arrowhead-accent)" />

  <!-- Result -->
  <rect x="500" y="360" width="240" height="80" rx="6" class="box-accent" />
  <text x="620" y="405" text-anchor="middle" class="label accent">Result</text>
</svg>
