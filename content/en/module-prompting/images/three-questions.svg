<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" style="max-width: 800px; background-color: transparent;">
  <style>
    text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .question { fill: #fafafa; font-size: 16px; font-weight: 500; text-anchor: middle; }
    .circle { fill: #27272a; stroke: #00d9c0; stroke-width: 3; }
    .connector { stroke: #00d9c0; stroke-width: 2; fill: none; }
  </style>

  <!-- Top circle: What does done look like? -->
  <ellipse cx="400" cy="140" rx="100" ry="100" class="circle" />
  <text x="400" y="130" class="question">What does</text>
  <text x="400" y="150" class="question">"done" look like?</text>

  <!-- Bottom left circle: What context does it need? -->
  <ellipse cx="200" cy="380" rx="100" ry="100" class="circle" />
  <text x="200" y="370" class="question">What context</text>
  <text x="200" y="390" class="question">does it need?</text>

  <!-- Bottom right circle: What are the boundaries? -->
  <ellipse cx="600" cy="380" rx="100" ry="100" class="circle" />
  <text x="600" y="370" class="question">What are the</text>
  <text x="600" y="390" class="question">boundaries?</text>

  <!-- Connecting lines -->
  <line x1="350" y1="220" x2="250" y2="300" class="connector" />
  <line x1="450" y1="220" x2="550" y2="300" class="connector" />
  <line x1="300" y1="380" x2="500" y2="380" class="connector" />
</svg>
