<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" style="max-width: 1100px; background-color: transparent;">
  <style>
    text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .title { fill: #a1a1aa; font-size: 18px; font-weight: 600; }
    .label { fill: #fafafa; font-size: 14px; }
    .shape { fill: #27272a; stroke: #3f3f46; stroke-width: 2; }
    .icon { fill: none; stroke: #00d9c0; stroke-width: 2; }
    .icon-thick { fill: none; stroke: #00d9c0; stroke-width: 3; }
    .connector { stroke: #00d9c0; stroke-width: 2; fill: none; }
    .arrow { fill: #00d9c0; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" class="title">Upload-and-Analyse Workflow</text>

  <!-- Step 1: Prepare clean data -->
  <rect x="40" y="80" width="140" height="100" rx="6" class="shape" />
  <rect x="80" y="95" width="60" height="40" rx="2" class="icon" />
  <line x1="85" y1="105" x2="135" y2="105" class="icon" />
  <line x1="85" y1="115" x2="135" y2="115" class="icon" />
  <line x1="85" y1="125" x2="120" y2="125" class="icon" />
  <polyline points="125,105 130,115 140,100" class="icon-thick" fill="none" />
  <text x="110" y="155" text-anchor="middle" class="label">1. Prepare</text>
  <text x="110" y="172" text-anchor="middle" class="label">clean data</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="130" x2="250" y2="130" class="connector" marker-end="url(#arrowhead)" />

  <!-- Step 2: Upload -->
  <rect x="260" y="80" width="140" height="100" rx="6" class="shape" />
  <line x1="330" y1="120" x2="330" y2="100" class="icon-thick" />
  <polyline points="320,107 330,97 340,107" class="icon-thick" fill="none" />
  <text x="330" y="155" text-anchor="middle" class="label">2. Upload</text>
  <text x="330" y="172" text-anchor="middle" class="label">data</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="130" x2="470" y2="130" class="connector" marker-end="url(#arrowhead)" />

  <!-- Step 3: Describe dataset -->
  <rect x="480" y="80" width="140" height="100" rx="6" class="shape" />
  <ellipse cx="550" cy="115" rx="40" ry="25" class="icon" />
  <text x="550" y="155" text-anchor="middle" class="label">3. Describe</text>
  <text x="550" y="172" text-anchor="middle" class="label">dataset</text>

  <!-- Arrow 3 -->
  <line x1="630" y1="130" x2="690" y2="130" class="connector" marker-end="url(#arrowhead)" />

  <!-- Step 4: Ask questions -->
  <rect x="700" y="80" width="140" height="100" rx="6" class="shape" />
  <ellipse cx="770" cy="115" rx="40" ry="25" class="icon" />
  <text x="770" y="155" text-anchor="middle" class="label">4. Ask</text>
  <text x="770" y="172" text-anchor="middle" class="label">questions</text>

  <!-- Arrow 4 -->
  <line x1="850" y1="130" x2="910" y2="130" class="connector" marker-end="url(#arrowhead)" />

  <!-- Step 5: Verify results -->
  <rect x="920" y="80" width="140" height="100" rx="6" class="shape" />
  <circle cx="980" cy="112" r="20" class="icon" />
  <line x1="995" y1="127" x2="1010" y2="142" class="icon" stroke-width="2" />
  <text x="990" y="155" text-anchor="middle" class="label">5. Verify</text>
  <text x="990" y="172" text-anchor="middle" class="label">results</text>
</svg>
